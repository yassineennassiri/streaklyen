<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Habit · Streaklyen</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="brand-bar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">&#10003;</span>
            <span class="brand-name">Streaklyen</span>
        </a>
    </div>

    <div class="page page-narrow">
        <a href="index.html" class="back-link">&larr; Back</a>
        <h1>Add a habit</h1>
        <p class="page-subtitle">Give it a clear, doable name. You can check it off starting today.</p>

        <form id="add-habit-form" class="form" novalidate>
            <label for="habit-name">Habit name</label>
            <input type="text" id="habit-name" name="name" placeholder="e.g. Read for 20 minutes" required autofocus>

            <p id="form-error" role="alert" hidden></p>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add habit</button>
                <button type="button" id="cancel-button" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
