<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today · Streaklyen</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="brand-bar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">&#10003;</span>
            <span class="brand-name">Streaklyen</span>
        </a>
    </div>

    <div class="page">
        <header class="page-header">
            <div>
                <p id="today-date" class="page-date"></p>
                <h1>Today</h1>
            </div>
            <a href="add.html" class="btn btn-primary btn-new-habit">+ New habit</a>
        </header>

        <main>
            <div class="progress-card">
                <div class="progress-card-row">
                    <span>Progress today</span>
                    <span id="progress-count">0/0</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <p id="habits-status" role="status">Loading habits…</p>
            <ul id="habits-list" class="habit-list"></ul>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
