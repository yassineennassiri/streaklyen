<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit · Streaklyen</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="brand-bar">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">&#10003;</span>
            <span class="brand-name">Streaklyen</span>
        </a>
    </div>

    <div class="page">
        <header class="page-header page-header-simple">
            <a href="index.html" class="back-link">&larr; Back</a>
            <h1 id="habit-name">Habit</h1>
        </header>

        <main>
            <p id="habit-status" role="status">Loading habit…</p>

            <div id="habit-detail" hidden>
                <section id="habit-stats" class="stats-row">
                    <div class="stat-card">
                        <p id="habit-streak" class="stat-value"></p>
                    </div>
                    <div class="stat-card">
                        <p id="habit-last30" class="stat-value"></p>
                    </div>
                </section>

                <p id="habit-created" class="muted-text"></p>

                <section id="habit-calendar" class="calendar-card">
                    <div class="calendar-card-header">
                        <h2 id="calendar-month"></h2>
                        <span class="calendar-legend"><span class="legend-dot" aria-hidden="true"></span>Completed</span>
                    </div>
                    <div class="calendar-weekdays" aria-hidden="true">
                        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                    </div>
                    <div id="calendar-grid" class="calendar-grid"></div>
                </section>

                <button type="button" id="delete-habit-button" class="delete-link">Delete habit</button>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
